/* PLAYABILITY / READABILITY OVERRIDE: primary controls use human-scale type and tap targets. */
:root{--copy:#f8ede6;--muted:#dbc9c4;--link:#ffd69f}
body{font-size:15px;line-height:1.55;letter-spacing:0}
.shell{width:min(1510px,100%);padding:24px 24px 80px}
.brand h1{font-size:clamp(30px,3.3vw,45px);line-height:1.16}
.brand .sub{font-size:14px;line-height:1.55;max-width:690px}
.btn{min-height:44px;font-size:14px;padding:10px 14px}
.btn.small{min-height:44px;font-size:14px;padding:8px 12px}
.hint{font-size:15px;line-height:1.6;gap:9px;padding:12px 16px}
.panel{padding:19px;border-radius:16px}
.panelhead{align-items:center;gap:12px}
.panelhead h2{font-size:20px;line-height:1.3}
.panelhead small{font-size:14px;line-height:1.5}
.kicker{font-size:11px;letter-spacing:.14em}
.caption{font-size:13.5px;line-height:1.65}
.game-layout{grid-template-columns:minmax(0,1fr) 295px;gap:16px}
.arena{grid-template-columns:minmax(230px,.85fr) minmax(0,1.45fr)}
.hero{min-height:250px;padding:19px}
.hero-label{font-size:12px;line-height:1.5}
.hero-name{font-size:31px}
.hpvalue{font-size:18px}
.hero .caption{font-size:13px}
.energyline{margin-top:13px}
.energyline strong{font-size:25px}
.counter,.chip{font-size:12px;line-height:1.5;padding:5px 8px}
.foe{min-height:211px;gap:10px}
.foe strong{font-size:19px}
.foe .type{font-size:11px}
.intent{font-size:13px;line-height:1.3;padding:7px 10px}
.hand{grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.card-shell{min-width:0;display:flex;flex-direction:column;position:relative;gap:0;transition:transform .14s}
.card-shell:hover{transform:translateY(-2px)}
.card-shell-disabled{opacity:.88}
.card{min-height:245px;flex:1;min-width:0;border-radius:13px 13px 0 0;padding:17px 15px 13px;gap:12px;text-align:left;overflow-wrap:anywhere;box-shadow:inset 0 1px #ffffff1b}
.card:not(:disabled):hover{transform:none}
.card:disabled{opacity:.64}
.card-header{display:flex;gap:12px;align-items:flex-start;min-width:0}
.card .cost{position:static;flex:0 0 35px;height:35px;width:35px;font-size:20px;font-weight:900;border-width:2px}
.card .name{margin:2px 0 0;min-height:0;font-weight:850;font-size:18px;line-height:1.35;letter-spacing:.01em;overflow-wrap:anywhere}
.card-description{display:grid;align-content:start;gap:10px;flex:1;min-height:120px;color:var(--copy)}
.card .description{font-size:16px;line-height:1.55}
.effect-line{display:block;font-size:15.5px;line-height:1.5;color:#f9eae2;overflow-wrap:anywhere}
.effect-line + .effect-line{padding-top:9px;border-top:1px solid #ffffff24;color:#ebd8cc}
.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:7px;border-top:1px solid #ffffff32;padding-top:10px;font-size:12.5px;color:#ebcbc0}
.card.skill .card-bottom{color:#b8e3e1}
.card.power .card-bottom{color:#e2c7f1}
.tag-once{color:#ffe4b7;background:#bc884329;padding:3px 5px;border-radius:5px;font-size:11px}
.card-unavailable{padding:6px;background:#171217;border-radius:5px;color:#f0bcb8;font-size:12px}
.card-help{width:100%;min-height:44px;text-align:center;font-size:14px;font-weight:700;color:#ffddb1;background:#392e32;border:1px solid #8e6263;border-top:0;border-radius:0 0 13px 13px;padding:7px 10px}
.card-help:hover{background:#584049}
.card-help:focus-visible{outline-offset:-2px}
.card-shell:has(.card.skill) .card-help{background:#284044;border-color:#5f8b8c}
.card-shell:has(.card.power) .card-help{background:#393047;border-color:#8d77a2}
.count-number{color:#f1c99e;font-size:16px}
.controls{gap:12px;margin-top:18px}
.controls .left{font-size:14px;line-height:1.5}
.controls #endBtn{font-size:17px;padding:12px 20px;min-height:50px}
.friendly-guide .guide-message{background:#513742;border:1px solid #966f74;padding:14px;border-radius:9px;color:#ffdfc3;font-size:15px;font-weight:700;line-height:1.6;margin-bottom:12px}
.friendly-guide .rule{font-size:15px;line-height:1.6;padding:9px 0}
.friendly-guide .rule strong{font-size:15px}
.friendly-guide .rule p{margin:5px 0 0;color:#e2d1c8;font-size:14px}
.entry{font-size:13px;line-height:1.6}
.entry span{font-size:11px}
.logs{max-height:280px}
.choices{gap:14px}
.choices .card-shell{min-width:0}
.choices .card{min-height:270px}
.screen{gap:20px}
.screen p{font-size:15px;line-height:1.75}
.modal{width:min(950px,100%);max-height:90vh;padding:27px;border-radius:17px;border:1px solid #a77c78}
.modal h2{font-size:27px;line-height:1.4}
.item{font-size:14px;line-height:1.6;padding:14px 8px}
.item strong{font-size:16px}
.readable-item{display:flex;align-items:center;gap:18px}
.item-main{flex:1;min-width:0}
.item-title{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.item-rarity{color:#d2bdba;font-size:13px}
.mini-cost{background:#281e1e;border:1px solid #cf9969;border-radius:50%;display:inline-grid;place-items:center;flex:0 0 34px;width:34px;height:34px;font-size:19px;font-weight:900;color:#f2cf91}
.readable-lines{display:grid;gap:6px}
.readable-lines .effect-line{font-size:15px;line-height:1.56}
.readable-lines .effect-line+.effect-line{padding-top:5px;border-top:1px solid #ffffff1a}
.search{font-size:16px;padding:14px;min-height:49px}
.practice-actions{gap:7px;min-width:126px}
.upgrades{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:11px}
.upgrade{min-height:155px;padding:15px;background:#33272e;border-radius:11px}
.upgrade strong{font-size:17px;margin-bottom:10px}
.upgrade .readable-lines{font-size:14px}
.notes p{font-size:15px;line-height:1.8}
.beginner-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.beginner-steps>div{padding:17px;background:#392b34;border:1px solid #775c60;border-radius:12px;line-height:1.5}
.beginner-steps b{color:#f6c9a4;font-size:17px}
.beginner-steps p{font-size:14px;margin:7px 0 0}
.terms-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.term-box{padding:16px;background:#332730;border:1px solid #70535b;border-radius:11px}
.term-box strong{font-size:18px;color:#ffdbac}
.term-box p{font-size:15px;line-height:1.75;color:#e9d6ce;margin:7px 0 0}
.detail-layout{display:grid;gap:16px}
.detail-head{display:flex;align-items:center;gap:18px;padding:14px 2px}
.detail-head h3{font-size:27px;line-height:1.3;margin:4px 0}
.detail-head p{margin:0;color:#d5b8b7;font-size:14px}
.detail-cost{min-width:65px;height:65px;border-radius:50%;background:#342522;border:2px solid #d3a16d;display:grid;place-items:center;align-content:center;font-size:28px;font-weight:900;color:#ffe1b5;line-height:1.05}
.detail-cost small{display:block;font-size:11px;font-weight:600}
.detail-versions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.detail-variant{padding:18px;border:1px solid #89636b;border-radius:11px;background:#342731}
.detail-variant.upgraded{background:#3c302b;border-color:#bd9763}
.detail-variant h4{font-size:18px;margin:0 0 12px;color:#ffe0bc}
.detail-variant h4 span{font-size:21px;color:#ffd18d}
.detail-notice{padding:10px 14px;color:#ffde9a;background:#71543044;border:1px solid #90734a;border-radius:10px;font-size:14px}
.source-foot{border-top:1px solid #76545b;padding-top:13px}
.source-foot h4{font-size:17px;margin:0 0 8px}
.source-foot p{font-size:14px;line-height:1.7;margin:4px 0;color:#d5c2be}
.source-foot a{color:#ffdcac;font-size:14px}
.technical-details{margin-top:5px;padding:12px 15px;background:#211a22;border-radius:9px;color:#d6c7c5}
.technical-details summary{cursor:pointer;font-size:14px;color:#ffe0aa}
.technical-details p{font-size:13px;line-height:1.75}
.toast{font-size:15px;padding:13px 19px;min-height:44px}

 damageEnemy(enemy,amount,{firstAttack=false,fromMark=false}={}){if(!enemy||enemy.hp<=0)return {hit:false,hpDamage:0};let total=Math.max(0,Math.floor(amount));if(firstAttack){if(this.butterfly>0)total+=this.hp<=this.maxHp/2?5:3;if(this.hearth>0 && this.hp<=this.maxHp/2)total+=this.hearth;if(this.prepAttack>0){total+=this.prepAttack;this.prepAttack=0;}}const absorbed=Math.min(total,enemy.block);enemy.block-=absorbed;const hpDamage=Math.min(enemy.hp,total-absorbed);const wasMarked=enemy.mark>0;enemy.hp-=hpDamage;if(enemy.hp<=0&&wasMarked&&this.markKillBlock>0){this.block+=this.markKillBlock;this.log(`敌人带血梅香阵亡：获得${this.markKillBlock}格挡。`);}if(total) this.log(`${enemy.name}受到${total}点${fromMark?'血梅香':'攻击'}伤害${absorbed?`（格挡${absorbed}）`:''}，实际失血${hpDamage}。`);return {hit:total>0,hpDamage};}

 play(uid,targetIndex=this.selected){const c=this.hand.find(x=>x.uid===uid);const can=this.canPlay(c,targetIndex);if(!can.ok)return can;const id=c.id,up=c.upgraded,n=(x,y)=>up?y:x,t=this.getTarget(targetIndex),cost=this.cardCost(c);const defs=CARDS[id];const operations=defs.effects?(up?defs.upgradeEffects:defs.effects):null;const pay=operations?operations.filter(x=>x.op==='pay').reduce((sum,x)=>sum+x.n,0):(id==='e'?6:id==='bloodshot'?2:0);const beforeLow=this.hp-pay<=this.maxHp/2;
 this.energy-=cost;this.hand.splice(this.hand.indexOf(c),1);if(pay){this.hp-=pay;this.log(`「${CARDS[id].name}」支付${pay}生命，当前${this.hp}/${this.maxHp}。`);if(!this.relicUsed){this.relicUsed=true;this.block+=4;this.log('引蝶灯触发：首笔生命支付获得4格挡。');}} else this.log(`打出「${CARDS[id].name}」，支付${cost}能量。`);
 // All costs were preflighted. Card state only changes after a successful preflight.
 let didHit=false;
 const attack=(enemy,base,isFirst=true)=>{const r=this.damageEnemy(enemy,base,{firstAttack:isFirst});if(r.hit)didHit=true;return r};
 const mark=(enemy)=>{if(enemy?.hp>0){enemy.mark=2;this.log(`${enemy.name}获得血梅香（2次，结束阶段每次2伤）。`);}};
 const charged=(result,enemy)=>{if(this.butterfly>0 && result.hpDamage>0 && enemy.hp>0)mark(enemy);};
 switch(id){
 case 'normal':attack(t,n(6,9));break;
 case 'guard':this.block+=n(5,8);break;
 case 'heavy':charged(attack(t,n(7,10)),t);break;
 case 'e':this.butterfly=Math.max(this.butterfly,2);if(up)this.block+=3;this.log('进入彼岸蝶舞：攻击牌首个命中额外+3，半血以下+5，持续2次己方结束阶段。');break;
 case 'q':{const amount=beforeLow?n(14,18):n(11,14);for(const e of [...this.live()])attack(e,amount,false);if(didHit){const ask=beforeLow?n(7,8):n(4,5),gain=Math.max(0,Math.min(ask,this.maxHp-this.hp,12-this.healUsed));this.hp+=gain;this.healUsed+=gain;this.log(`安神秘法恢复${gain}生命，本场累计已恢复${this.healUsed}/12。`);}break;}
 case 'caution':this.block+=n(7,10)+(beforeLow?3:0);break;
 case 'mark':attack(t,n(4,6),false);mark(t);break;
 case 'aid':this.block+=n(7,10);this.draw(1);break;
 case 'trick':this.draw(1);if(this.butterfly>0)this.block+=n(3,5);break;
 case 'farewell':attack(t,n(6,8));if(t.hp>0&&t.mark>0){const ticks=t.mark;t.mark=0;this.log(`提前兑现${ticks}次血梅香。`);this.damageEnemy(t,ticks*n(3,4),{fromMark:true});}break;

 case 'wildfire':{let first=true;for(const e of [...this.live()]){attack(e,n(5,7)+(e.mark>0?n(3,4):0),first);first=false;}break;}
 case 'hearth':this.hearth=Math.max(this.hearth,n(2,3));break;
 case 'afterglow':this.block+=n(6,9);if(this.butterfly>0)this.drawOnButterflyEnd=Math.max(this.drawOnButterflyEnd,2);break;

 case 'last':this.block+=n(6,9);if(this.hp<=Math.floor(this.maxHp/4)){this.guardLife=true;this.log('护命生效：本回合首次致命伤害仅降至1HP。');}break;

 }
 if(['q','trick','hearth','last'].includes(id)||defs.exhaust)this.exhaustPile.push(c);else this.discardPile.push(c);
 this.checkWin();return {ok:true};}

 // Interprets the 57-card expansion. One source for values, UI text and simulation.
 resolveExtraCard(card,target,effects,wasLow){
  const data=CARDS[card.id];const startedInButterfly=this.butterfly>0;
  const startedMarked=!!(target?.mark>0),enemyHalf=!!(target && target.hp*2<=target.maxHp),startedMulti=this.live().length>=2;
  const markedAtPlay=new Map(this.live().map(enemy=>[enemy.id,enemy.mark>0])); // Snapshot before the card's earlier effects can apply a fresh mark.
  const permitted=(e)=>{switch(e.if){case undefined:return true;case 'low':return wasLow;case 'high':return !wasLow;case 'butterfly':return startedInButterfly;case 'marked':return startedMarked;case 'unmarked':return !startedMarked;case 'enemy_half':return enemyHalf;case 'multi':return startedMulti;default:throw Error('bad effect condition '+e.if);}};

  const doHeal=(n)=>{const actual=Math.min(Math.max(0,n),Math.max(0,12-this.healUsed),Math.max(0,this.maxHp-this.hp));this.hp+=actual;this.healUsed+=actual;this.log(`恢复${actual}生命（本战已用${this.healUsed}/12）。`);};

       for(let i=0;i<(e.hits||1);i++){

       }
       if(enemy.hp>0 && (e.markOnHit || (e.markIfButterfly&&startedInButterfly)) && touchedHP)markOne(enemy);
      }
      break;
    }
    case 'block':this.block+=e.n;this.log(`获得${e.n}格挡。`);break;
    case 'draw':this.draw(e.n);this.log(`抽牌${e.n}（受手牌上限限制）。`);break;
    case 'mark':for(const enemy of e.all?[...this.live()]:[target])markOne(enemy);break;
    case 'cash':if(target?.hp>0&&target.mark>0){const remaining=target.mark;target.mark=0;this.damageEnemy(target,remaining*e.n,{fromMark:true});this.log(`提前结算${remaining}次血梅香。`);}break;
    case 'heal':doHeal(e.n);break;
    case 'nextDraw':this.nextDraw=Math.min(2,this.nextDraw+e.n);this.log(`下回合额外抽牌上限现为${this.nextDraw}。`);break;
    case 'nextBlock':this.nextBlock=Math.min(12,this.nextBlock+e.n);this.log(`下回合预备格挡现为${this.nextBlock}。`);break;
    case 'nextEnergy':this.nextEnergy=Math.min(2,this.nextEnergy+e.n);this.log(`下回合额外能量现为${this.nextEnergy}。`);break;
    case 'weak':for(const enemy of e.all?[...this.live()]:[target])if(enemy?.hp>0){enemy.weak=Math.max(enemy.weak||0,e.n);this.log(`${enemy.name}接下来${e.n}次攻击降低25%伤害。`);}break;
    case 'prepAttack':this.prepAttack=Math.max(this.prepAttack,e.n);this.log(`本回合下一张攻击首命中额外+${this.prepAttack}。`);break;
    case 'butterfly':this.butterfly=Math.max(this.butterfly,e.n);this.log(`蝶舞刷新为${this.butterfly}次己方结束阶段。`);break;
    case 'endButterfly':if(this.butterfly>0){this.butterfly=0;if(this.drawOnButterflyEnd>0){this.nextDraw=Math.min(2,this.nextDraw+this.drawOnButterflyEnd);this.drawOnButterflyEnd=0;}this.log('主动结束蝶舞。');}break;
    case 'hearthPower':this.hearth=Math.max(this.hearth,e.n);this.log(`本战低血攻击强化提升至+${this.hearth}。`);break;
    case 'bloomPower':this.bloomPower=Math.max(this.bloomPower,e.n);this.log(`本战血梅香伤害额外+${this.bloomPower}。`);break;
    case 'markKillBlock':this.markKillBlock=Math.max(this.markKillBlock,e.n);this.log('带梅敌人被击败时追加防护生效。');break;

    default:throw Error('unknown experimental card effect '+e.op);
   }
  }

 checkWin(){if(this.phase==='combat' && this.live().length===0){this.wins++;this.log(`战斗胜利，剩余${this.hp}生命。`);this.block=0;this.butterfly=0;this.guardLife=false;if(this.floor>=5){this.phase='win';this.log('五战完成！');}else{this.phase='reward';this.offers=this.offerRewards();}}}
 offerRewards(){const candidates=this.shuffle([...REWARD_POOL]);return candidates.slice(0,3);}
 takeReward(id){if(this.phase!=='reward')return {ok:false,reason:'未处于奖励阶段'};if(id!==null&&!this.offers.includes(id))return {ok:false,reason:'奖励不存在'};if(id!==null){this.deck.push(this.newCard(id));this.log(`奖励：获得「${CARDS[id].name}」。`)}else this.log('跳过选牌奖励。');this.floor++;if([3,5].includes(this.floor)){this.phase='camp';this.offers=[];}else this.startCombat(this.floor-1);return {ok:true};}
 takeCamp(choice,uid){if(this.phase!=='camp')return {ok:false,reason:'不是营地阶段'};if(choice==='rest'){const n=Math.min(18,this.maxHp-this.hp);this.hp+=n;this.log(`营地休息：回复${n}生命。`);}else if(choice==='upgrade'){const card=this.deck.find(c=>c.uid===uid&&!c.upgraded);if(!card)return {ok:false,reason:'不可升级这张卡'};card.upgraded=true;this.log(`营地升级：「${CARDS[card.id].name}」+。`);}else return {ok:false,reason:'未知营地操作'};this.startCombat(this.floor-1);return {ok:true};}

 if(this.phase==='combat'){this.counter=0;if(this.butterfly>0){this.butterfly--;if(this.butterfly===0){this.log('彼岸蝶舞结束。');if(this.drawOnButterflyEnd>0){this.nextDraw+=this.drawOnButterflyEnd;this.log(`蝶隐之时：下回合额外抽${this.drawOnButterflyEnd}张。`);this.drawOnButterflyEnd=0;}}}this.beginTurn();}return {ok:true};}
 testWinBattle(){// Only used by isolated tests. Not called by UI.

}

case 'guide':return `<div class="notes"><div class="beginner-steps"><div><b>① 看敌人</b><p>红色代表攻击，先想想要不要格挡。</p></div><div><b>② 选目标</b><p>点击敌人，再点击想打的卡。</p></div><div><b>③ 结束回合</b><p>用完能量就结束；敌人随后行动。</p></div></div><p><strong>怎么玩：</strong>点击敌人选目标、再点击手牌。下方结束回合后，先结算血梅香，再由仍存活的敌人按意图行动。每回合重新获得3能量、抽5张。数字键1–9选牌，空格结束回合。</p><p><strong>胡桃的关键决策：</strong>蝶引来生支付6HP进入2次己方结束阶段的蝶舞。半血（≤36HP）后攻击首命中增强，但生命不会自动恢复；安神秘法可造成群伤与回血，最多共回复12HP/战，命中后也可能改变你的低血状态。</p><p><strong>完整流程：</strong>连续5战，战后奖励三选一或跳过；第2、4战后可以休息+18HP，或选择升级一张永久卡。战斗内消耗不等于从永久卡组删除。</p><p><button class="btn ghost" data-terms>打开术语速查（半血 / 格挡 / 血梅香）</button></p><p><strong>已知测试边界：</strong>这是原作人物概念启发的独立回合制玩法实验，没有复用官方角色语音或素材；所有数值均为候选。没有联网，也不会碰正式游戏存档。</p></div>`;
case 'deck':return `<div class="caption">共${g.deck.length}张牌，升级计入永久牌组。当前抽/弃牌区只在本场有效。</div><div class="items">${deckList()}</div>`;
case 'library':return `<div class="caption">完整75张候选卡牌。点击一张的「详情 / 升级」，可以看清普通版与升级版的差异。</div><div class="rarity-filters">${['全部','基础','普通','罕见','稀有'].map(r=>`<button class="rarity-tab ${libraryRarity===r?'active':''}" data-library-rarity="${r}">${r}${r==='全部'?'（75）':'（'+Object.values(CARDS).filter(c=>c.rarity===r).length+'）'}</button>`).join('')}</div><input type="search" class="search" id="libSearch" placeholder="按卡名 / 功能 / 稀有度筛选" aria-label="搜索卡牌" /><div id="libResults" class="items">${libraryList()}</div>`;
case 'upgrade':return `<div class="caption">选择一张未升级的牌。升级会永久改变这张牌的效果。</div><div class="upgrades">${g.deck.filter(c=>!c.upgraded).map(c=>`<button class="upgrade" data-upgrade="${c.uid}"><strong>${html(CARDS[c.id].name)} +</strong><div class="readable-lines">${showCardSummary({id:c.id,upgraded:true})}</div></button>`).join('')||'<p class="empty">牌组已全部升级</p>'}</div>`;
default:return '';
}}
function renderDialog(){const root=el('overlayRoot');if(!dialog){root.innerHTML='';return;}
 const isInspect=dialog.startsWith('inspect:');const name=isInspect?(CARDS[dialog.slice(8)]?.name||'卡牌详情'):({guide:'玩法说明',terms:'术语速查',deck:'当前牌组',library:'完整75张卡牌',upgrade:'选择升级卡牌',practice:'自由试牌台'})[dialog]||'详情';
 root.innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-label="${html(name)}"><div class="modal"><div class="modal-head"><div><div class="kicker">HU TAO · ${isInspect?'卡牌详情':'试玩说明'}</div><h2>${html(name)}</h2></div><button class="btn small" id="closeDialog">关闭 ✕</button></div>${dialogContents()}</div></div>`;
}
function reset(){g=new HutaoGame(2);dialog=null;render();gotoTop();}
async function copyReport(){const lines=[`胡桃 V5 五战战报 · 种子2 · ${g.phase}`,`进度${g.wins}/5 · 当前生命${g.hp}/${g.maxHp}`,`牌组：${g.deck.map(c=>CARDS[c.id].name+(c.upgraded?'+':'')).join('、')}`,...g.logs.slice().reverse().map(l=>`[战${l.floor}/回${l.turn}] ${l.msg}`)];const txt=lines.join('\n');try{await navigator.clipboard.writeText(txt);toast('战报已复制，可以粘贴给 AI 分析。')}catch(err){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.left='-99999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('已使用本地方式复制战报。')}catch(e){toast('浏览器限制了剪贴板，请改用手动复制。')}ta.remove();}}
document.addEventListener('click',e=>{
 const btn=e.target.closest('button');if(!btn)return;
 if(btn.dataset.libraryRarity){libraryRarity=btn.dataset.libraryRarity;const input=el('libSearch');const term=input?.value||'';const list=el('libResults');if(list)list.innerHTML=libraryList(term);document.querySelectorAll('.rarity-tab').forEach(x=>x.classList.toggle('active',x.dataset.libraryRarity===libraryRarity));return;}
 if(btn.dataset.inspectCard){openModal('inspect:'+btn.dataset.inspectCard);return;}
 if(btn.dataset.terms!==undefined){openModal('terms');return;}
 if(btn.dataset.practice){const added=g.practiceAdd(btn.dataset.practice,btn.dataset.upgraded==='true');if(added.ok){dialog=null;render();toast('试牌已加入卡组'+(g.hand.some(c=>c.id===btn.dataset.practice)?'，可在手牌立即测试':'，下次抽牌会出现'))}else toast(added.reason);return;}
 if(btn.dataset.card){const uid=Number(btn.dataset.card),c=g.hand.find(x=>x.uid===uid);const result=g.play(uid);render();if(!result.ok)toast(result.reason);else if(c)toast('已打出「'+CARDS[c.id].name+'」');return;}
 if(btn.dataset.target!==undefined){g.selected=Number(btn.dataset.target);render();return;}
 if(btn.dataset.reward!==undefined){const r=g.takeReward(btn.dataset.reward==='skip'?null:btn.dataset.reward);if(!r.ok)toast(r.reason);render();gotoTop();return;}
 if(btn.dataset.camp){if(btn.dataset.camp==='rest'){const r=g.takeCamp('rest');if(!r.ok)toast(r.reason);render();gotoTop();}else openModal('upgrade');return;}
 if(btn.dataset.upgrade){const r=g.takeCamp('upgrade',Number(btn.dataset.upgrade));if(!r.ok)toast(r.reason);dialog=null;render();gotoTop();return;}
 if(btn.id==='endBtn'){g.endTurn();render();return;}
 if(btn.id==='guideBtn'){openModal('guide');return;}
 if(btn.id==='deckBtn'||btn.id==='deckEndBtn'){openModal('deck');return;}
 if(btn.id==='libraryBtn'){openModal('library');return;}
 if(btn.id==='practiceBtn'){openModal('practice');return;}
 if(btn.id==='closeDialog'){closeModal();return;}
 if(btn.id==='reportBtn'){copyReport();return;}
 if(btn.id==='restartBtn'){if(window.confirm('重新开始五战？当前记录将丢失。'))reset();return;}
 if(btn.id==='againBtn'){reset();return;}
});
document.addEventListener('input',e=>{if(e.target.id==='libSearch'){const n=el('libResults');if(n)n.innerHTML=libraryList(e.target.value);}if(e.target.id==='practiceSearch'){const n=el('practiceResults');if(n)n.innerHTML=practiceList(e.target.value);}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea')||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='Escape'&&dialog){closeModal();return;}if(dialog||g.phase!=='combat')return;if(e.code==='Space'){e.preventDefault();g.endTurn();render();return;}if(/^[1-9]$/.test(e.key)){const c=g.hand[Number(e.key)-1];if(c){const r=g.play(c.uid);if(!r.ok)toast(r.reason);render();}}});
// Read-only diagnostics allow browser-level proof without exposing mutation buttons or test cheats.
Object.defineProperty(window,'__hutaoReadOnly',{value:Object.freeze({state:()=>g.snapshot(),phase:()=>g.phase}),configurable:false});
render();

</script>
</body></html>
