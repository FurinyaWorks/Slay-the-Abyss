<!doctype html><html lang="zh"><meta charset="utf-8"><title>夜兰设计试牌 · 未定稿</title><style>body{background:#10202c;color:#e8f4ff;font:18px system-ui;max-width:1050px;margin:24px auto;padding:20px}button,select{font:inherit;padding:12px;margin:6px;background:#e5f4ff;color:#10202c;border:0;border-radius:8px}#hand{display:flex;flex-wrap:wrap}#hand button{width:235px;text-align:left}button:disabled{opacity:.45}pre{white-space:pre-wrap}aside{color:#ffc870}</style>
<h1>夜兰：收网，还是继续布置？</h1><aside>G3 设计玩具，不是正式技能。名字待审，数值候选，未通过人类试玩。只实现单敌短战；不代表正式游戏的平衡或性能。</aside>
<p>索上限3、跨回合保留。兑现牌消耗全部索；玲珑窗口只在本回合对后续攻击追加伤害。先看敌人公开意图，再决定伤害、防守、铺垫。</p>
<label>卡组 <select id="deck"><option value="starter">初始10牌</option><option value="line">理想索样板13牌</option><option value="dice">理想玲珑样板13牌</option></select></label>
<label>敌人 <select id="enemy"><option value="pressure">持续压力</option><option value="armor">每回合8护甲</option><option value="burst">蓄力大伤</option></select></label>
<label>种子 <input id="seed" type="number" value="1" min="1" style="width:70px"></label><label><input id="up" type="checkbox">全升级（对照）</label><button id="reset">重新开始</button>
<h2 id="state"></h2><div id="hand"></div><button id="end">结束回合</button><button id="save">下载本局选择记录</button><pre id="log"></pre>
<p>试玩后记录：你在哪回合选择收网/继续攒索？是否有一次反过来选更好？玲珑是否总是死抽？下一局还想换哪套？仅记录体验，不以胜利替代好玩。</p>
<script type="module">
import{start,intent,play,end,text}from'./engine.mjs';const {cards}=await(await fetch('./cards.json')).json();let s;const $=id=>document.getElementById(id);function render(){$('state').textContent=`回合${s.turn} · 生命${s.hp} · 能量${s.energy} · 格挡${s.block} · 索${s.line}/3 · 玲珑${s.dice}次 | 敌生命${s.enemyHp} 护甲${s.enemyBlock} 意图${intent(s)}${s.over?(s.hp?' · 胜利':' · 失败'):''}`;$('hand').replaceChildren();s.hand.forEach((id,i)=>{const c=s.cards[id],b=document.createElement('button');b.textContent=`待命名·${id} / ${c.role} / ${c.cost}费\n${text(c,s.upgraded)}`;b.disabled=s.over||s.energy<c.cost;b.onclick=()=>{play(s,i);render();};$('hand').append(b);});$('end').disabled=s.over;$('log').textContent=s.log.slice(-12).join('\n');}
$('reset').onclick=()=>{s=start(cards,{seed:Number($('seed').value)||1,deck:$('deck').value,enemy:$('enemy').value,upgraded:$('up').checked});render();};$('end').onclick=()=>{end(s);render();};$('save').onclick=()=>{const b=new Blob([JSON.stringify({version:'yelan-g3-r0-20261114',seed:s.seed,deck:s.deck,enemy:s.enemy,upgraded:s.upgraded,hp:s.hp,enemyHp:s.enemyHp,turn:s.turn,log:s.log},null,2)],{type:'application/json'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='yelan-playtest.json';a.click();URL.revokeObjectURL(u);};$('reset').click();
</script></html>
