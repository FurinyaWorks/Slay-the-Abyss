 case 'damage':s=e.all?`对全体敌人造成${e.n}点伤害`:`对目标${e.hits&&e.hits>1?`造成${e.hits}次${e.n}点伤害`:`造成${e.n}点伤害`}`;if(e.bonusIfMarked)s+=`；打出前目标已有血梅香时额外${e.bonusIfMarked}伤害`;if(e.bonusIfLow)s+=`；半血时额外${e.bonusIfLow}伤害`;if(e.markIfButterfly)s+='；蝶舞期间实际伤及生命且目标存活时施加血梅香';if(e.markOnHit)s+='；实际伤及生命且目标存活时施加血梅香';break;
 case 'block':s=`获得${e.n}点格挡`;break;
 case 'pay':s=`支付${e.n}点生命（不能致死）`;break;
 case 'draw':s=`抽${e.n}张牌`;break;
 case 'mark':s=e.all?'给所有敌人施加2次血梅香':'给目标施加2次血梅香';break;
 case 'cash':s=`提前兑现目标剩余血梅香，每次造成${e.n}伤害`;break;
 case 'heal':s=`恢复最多${e.n}点生命（计入每战12点额度）`;break;
 case 'nextBlock':s=`下回合额外获得${e.n}格挡（全来源上限12）`;break;
 case 'nextDraw':s=`下回合额外抽${e.n}张牌（全来源上限2）`;break;
 case 'nextEnergy':s=`下回合额外获得${e.n}能量（全来源上限2）`;break;
 case 'weak':s=e.all?`所有敌人下次攻击伤害降低25%`:`目标下次攻击伤害降低25%`;break;
 case 'prepAttack':s=`本回合下一张攻击牌首命中+${e.n}伤害`;break;
 case 'butterfly':s=`获得或刷新${e.n}次结束阶段的彼岸蝶舞`;break;
 case 'endButterfly':s='结束当前彼岸蝶舞';break;
 case 'hearthPower':s=`本战半血攻击首命中额外+${e.n}伤（不叠加，取较大值）`;break;
 case 'bloomPower':s=`本战血梅香每次额外+${e.n}伤（不叠加，取较大值）`;break;
 case 'counter':s=`本回合遭受下一次攻击后反击${e.n}伤`;break;

 case 'markKillBlock':s=`本战每次击败有血梅香的敌人，获得${e.n}格挡`;break;
 default:throw new Error(`undocumented DSL op ${e.op}`);
 }
 return (e.if?(conditionText[e.if]||`若${e.if}`)+'，':'')+s;
}

 checkWin(){if(this.phase==='combat' && this.live().length===0){this.wins++;this.log(`战斗胜利，剩余${this.hp}生命。`);this.block=0;this.butterfly=0;this.guardLife=false;if(this.floor>=5){this.phase='win';this.log('五战完成！');}else{this.phase='reward';this.offers=this.offerRewards();}}}
 offerRewards(){const candidates=this.shuffle([...REWARD_POOL]);return candidates.slice(0,3);}
 takeReward(id){if(this.phase!=='reward')return {ok:false,reason:'未处于奖励阶段'};if(id!==null&&!this.offers.includes(id))return {ok:false,reason:'奖励不存在'};if(id!==null){this.deck.push(this.newCard(id));this.log(`奖励：获得「${CARDS[id].name}」。`)}else this.log('跳过选牌奖励。');this.floor++;if([3,5].includes(this.floor)){this.phase='camp';this.offers=[];}else this.startCombat(this.floor-1);return {ok:true};}
 takeCamp(choice,uid){if(this.phase!=='camp')return {ok:false,reason:'不是营地阶段'};if(choice==='rest'){const n=Math.min(18,this.maxHp-this.hp);this.hp+=n;this.log(`营地休息：回复${n}生命。`);}else if(choice==='upgrade'){const card=this.deck.find(c=>c.uid===uid&&!c.upgraded);if(!card)return {ok:false,reason:'不可升级这张卡'};card.upgraded=true;this.log(`营地升级：「${CARDS[card.id].name}」+。`);}else return {ok:false,reason:'未知营地操作'};this.startCombat(this.floor-1);return {ok:true};}
 enemyIntent(enemy){return enemy.pattern[(this.turn-1)%enemy.pattern.length];}
 endTurn(){if(this.phase!=='combat')return {ok:false,reason:'不可结束回合'};this.log(`结束第${this.turn}回合。`);this.discardPile.push(...this.hand.splice(0));
 // Death from blood blossom cancels the dead enemy's action in the same end phase.
 for(const enemy of this.enemies){if(enemy.hp<=0||!enemy.mark)continue;this.damageEnemy(enemy,2+this.bloomPower,{fromMark:true});enemy.mark=Math.max(0,enemy.mark-1);}
 this.checkWin();if(this.phase!=='combat')return {ok:true};
 // Enemy shield from last enemy guard action survives one player turn, then expires before next enemy action.
 for(const enemy of this.live())enemy.block=0;
 for(const enemy of this.live()){const intent=this.enemyIntent(enemy);if(intent.type==='attack'){this.log(`${enemy.name}发动攻击${intent.amount}。`);const debuffed=(enemy.weak||0)>0;const amount=debuffed?Math.max(0,Math.floor(intent.amount*0.75)):intent.amount;if(debuffed)enemy.weak--;this.takeHeroDamage(amount);if(this.phase==='combat'&&this.counter>0&&enemy.hp>0){this.damageEnemy(enemy,this.counter,{fromMark:false});this.counter=0;this.checkWin();}}else if(intent.type==='guard'){enemy.block+=intent.amount;this.log(`${enemy.name}获得${intent.amount}格挡。`);}if(this.phase==='lose')break;}
 if(this.phase==='combat'){this.counter=0;if(this.butterfly>0){this.butterfly--;if(this.butterfly===0){this.log('彼岸蝶舞结束。');if(this.drawOnButterflyEnd>0){this.nextDraw+=this.drawOnButterflyEnd;this.log(`蝶隐之时：下回合额外抽${this.drawOnButterflyEnd}张。`);this.drawOnButterflyEnd=0;}}}this.beginTurn();}return {ok:true};}
 testWinBattle(){// Only used by isolated tests. Not called by UI.
 if(this.phase!=='combat')throw Error('not combat');this.enemies.forEach(e=>e.hp=0);this.checkWin();}
}

</script>
<script>
let g=new HutaoGame(2), dialog=null;
const el=id=>document.getElementById(id);
const html=x=>String(x??'').replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]));
const phaseTitle=()=>g.phase==='reward'?'战后奖励':g.phase==='camp'?'营地休整':g.phase==='win'?'五战完成':g.phase==='lose'?'本次挑战结束':`第 ${g.floor} 战 / ${ENCOUNTERS[g.floor-1].name}`;
const low=()=>g.hp<=g.maxHp/2, quarter=()=>g.hp<=Math.floor(g.maxHp/4);
function toast(message){const t=el('toast');t.textContent=message;t.classList.remove('hidden');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.add('hidden'),2500);}
function gotoTop(){if(window.scrollY>360)window.scrollTo({top:0,behavior:'smooth'});}
function renderProgress(){el('progress').innerHTML=ENCOUNTERS.map((x,i)=>`<div class="step ${i+1<g.floor?'done':i+1===g.floor?'active':''}">${i+1}. ${html(x.name)}</div>`).join('');}
function pill(text,kind=''){return `<span class="chip ${kind}">${html(text)}</span>`}
function cardTag(card,{reward=false,disabled=false}={}){
 const d=CARDS[card.id],css=d.type==='攻击'?'attack':d.type==='能力'?'power':'skill';
 const reason=g.phase==='combat'?g.canPlay(card).reason:'';
 const cost=g.cardCost(card),up=card.upgraded;
 return `<button type="button" class="card ${css} ${d.rarity==='稀有'?'rare':''}" ${!reward?`data-card="${card.uid}"`:''} ${reward?`data-reward="${d.id}"`:''} ${disabled?'disabled':''} title="${html(disabled?(reason||'无法使用'):SOURCE_NOTES[d.source])}" aria-label="${html(d.name)}${up?'+':''}：${html(g.cardText(card))}"><span class="cost">${cost}</span><span class="name">${html(d.name)}${up?'+':''}</span><p>${html(g.cardText(card))}</p><span class="foot"><span>${html(d.type)} · ${html(d.rarity)}</span><span>${html((disabled?(reason||'暂不可用'):d.role.split('，')[0]))}</span></span></button>`;
}
function cardDisplay(card,opts={}){const allowed=g.phase==='combat'&&g.canPlay(card).ok;return cardTag(card,{...opts,disabled:opts.reward===true?false:!allowed});}
function heroHtml(){let h=(g.hp/g.maxHp*100).toFixed(2);
 return `<div class="hero" id="heroArea"><div class="hero-label">PLAYER · 往生堂第七十七代堂主</div><h2 class="hero-name">胡桃 <small>长柄 · 火</small></h2><div class="bars"><div class="hpvalue">生命 ${g.hp} / ${g.maxHp} ${low()?'<span style="font-size:11px;color:#f2a197">· 血之灶火范围</span>':''}</div><div class="bar"><i style="width:${h}%"></i></div><div class="caption">半血阈值 36HP · 生命跨战保留</div></div><div class="statline">${pill(`格挡 ${g.block}`,'green')}${pill(`蝶舞 ${g.butterfly} 次结束阶段`,g.butterfly?'red':'')}${pill(`战内治疗 ${g.healUsed}/12`)}${g.practiceUsed?pill('自由试牌 · 非自然选牌','gold'):''}${g.nextEnergy?pill(`明回合额外能量 +${g.nextEnergy}`,'gold'):''}${g.markKillBlock?pill(`梅香收割防护 +${g.markKillBlock}`,'green'):''}${g.bloomPower?pill(`血梅香额外 +${g.bloomPower}`,'red'):''}${g.hearth?pill(`血之灶火 +${g.hearth}`,'red'):''}${g.guardLife?pill('幽蝶护命有效','gold'):''}</div><div class="energyline"><span class="orb" aria-hidden="true"></span><strong>${g.energy}</strong><span class="caption">/ 3 本回合能量</span></div><div class="statline"><span class="counter">引蝶灯 ${g.relicUsed?'本战已触发':'可触发 +4格挡'}</span>${g.nextDraw||g.drawOnButterflyEnd?'<span class="counter good">蝶隐之时 · 后续抽牌</span>':''}</div></div>`;
}
function foeHtml(e,i){const intent=g.enemyIntent(e),isGuard=intent.type==='guard';const selected=(g.getTarget()===e);
 return `<button type="button" class="foe ${selected?'selected':''} ${e.hp===0?'dead':''}" data-target="${i}" ${e.hp===0?'disabled':''} aria-label="选择目标：${html(e.name)}，生命${e.hp}/${e.maxHp}"><div><span class="icon">${html(e.icon)}</span><span class="type">${selected?'已锁定目标':'点击锁定'}</span></div><strong>${html(e.name)}</strong><div class="hpvalue">${e.hp} / ${e.maxHp} HP</div><div class="bar"><i style="width:${(e.hp/e.maxHp*100).toFixed(2)}%"></i></div><div class="enemy-meta">${e.block?pill(`格挡 ${e.block}`,'green'):''}${e.mark?pill(`血梅香 ${e.mark}`, 'red'):''}${e.weak?pill(`削势 ${e.weak}次`,'green'):''}</div><div class="intent ${isGuard?'guard':''}">${isGuard?'▣ · 防御':'⚔ · 攻击'} ${intent.amount}</div></button>`;
}
function combatScreen(){const d=ENCOUNTERS[g.floor-1];let hand=g.hand.map(c=>cardDisplay(c)).join('');return `<section class="panel"><div class="panelhead"><h2>${html(d.name)}</h2><small>${html(d.description)} · 第 ${g.turn} 回合</small></div><div class="arena">${heroHtml()}<div class="enemy-grid">${g.enemies.map(foeHtml).join('')}</div></div></section><section class="panel"><div class="panelhead"><h2>手牌 ${g.hand.length} / 10</h2><small>先选敌人，再点击要打出的牌 · 禁用牌可悬停查看原因</small></div><div class="hand">${hand||'<div class="empty">手牌已打完。结束回合或等待下一轮抽牌。</div>'}</div><div class="controls"><div class="left">抽牌堆 ${g.drawPile.length} · 弃牌堆 ${g.discardPile.length} · 本场消耗 ${g.exhaustPile.length}</div><button id="endBtn" class="btn primary">结束回合 <span aria-hidden="true">[Space]</span></button></div></section>`;}
function rewardScreen(){return `<section class="panel screen"><div class="kicker">STAGE ${g.floor} CLEARED</div><h2>此战已胜，下一步如何构筑？</h2><p>剩余 <strong>${g.hp}/${g.maxHp} HP</strong>。从三张候选奖励中选一张加入卡组，或跳过；生命会带入下一场。</p><div class="choices">${g.offers.map(id=>cardDisplay({id,uid:-1,upgraded:false},{reward:true})).join('')}</div><button class="btn ghost" data-reward="skip">跳过奖励，保留当前牌组</button></section>`;}
function campScreen(){return `<section class="panel screen"><div class="kicker">CAMP · ${g.floor===3?'第二战后':'第四战后'}</div><h2>回血，还是让一张牌变强？</h2><p>现在剩余 ${g.hp}/${g.maxHp}HP。选择休息会恢复至多18HP；选择升级则改良整场牌组的一张牌。</p><div class="choices"><button class="btn bright" data-camp="rest" style="min-height:130px"><b style="font-size:18px">休息</b><div class="caption" style="margin-top:8px">恢复 ${Math.min(18,g.maxHp-g.hp)}HP</div></button><button class="btn primary" data-camp="upgrade" style="min-height:130px"><b style="font-size:18px">升级卡牌</b><div class="caption" style="margin-top:8px">永久改善一张基础/奖励卡</div></button></div><div class="caption">没有免费两全。下一战将清空临时蝶舞、血梅香、遗物触发次数和格挡。</div></section>`;}
function endScreen(){const win=g.phase==='win';return `<section class="panel screen"><div class="kicker">${win?'FIVE BATTLES CLEARED':'CHALLENGE OVER'}</div><h2>${win?'五战完成 · 你守住了最后一线生机':'本次挑战结束 · 记录这场战斗'}</h2><p>${win?'从开局到终门，你完成了连续五场战斗。':'本次失败不会覆盖正式游戏。你可以重开同种子，也可以从日志找出HP如何流失。'}${g.practiceUsed?'【自由试牌】本局包含人工加入的卡牌，不作为自然构筑平衡证据。':''}</p><div class="statline" style="justify-content:center">${pill(`完成 ${g.wins}/5 战`,'gold')}${pill(`剩余 ${g.hp}/${g.maxHp} HP`,win?'green':'red')}${pill(`卡组 ${g.deck.length} 张`)}${pill(`最终第 ${g.floor} 战 · 第 ${g.turn} 回合`)}</div><div class="actions" style="justify-content:center"><button class="btn primary" id="againBtn">使用同种子重新挑战</button><button class="btn ghost" id="reportBtn">复制完整战报</button><button class="btn ghost" id="deckEndBtn">查看最终卡组</button></div><div class="caption">提示：战报可以直接发给 AI 帮助分析卡牌和跨战生命经济。</div></section>`;}
function asideHtml(){const tip=g.phase==='combat'&&g.live().some(e=>g.enemyIntent(e).type==='attack')?'看到敌方攻击时，决定是格挡、回血，还是抢先击杀。':'观察敌人意图，尽量避免无意义地付血。';const hero=g.phase==='combat'?`<div class="rule"><strong>当前选择</strong><br>${html(g.getTarget()?.name||'无存活敌人')}</div>`:'';
return `<section class="panel"><div class="panelhead"><h2>策略参考</h2></div><div class="sideinfo">${hero}<div class="rule"><strong>风险档位</strong><br>${quarter()?'≤25% · 濒危':low()?'≤50% · 低血增伤':'安全血线'}（当前 ${g.hp}/${g.maxHp}）</div><div class="rule"><strong>蝶舞</strong><br>每张攻击牌首命中+3；半血时+5；重击能挂血梅香</div><div class="rule"><strong>血梅香</strong><br>己方回合结束扣伤2点/次，格挡会抵消。可提前兑现。</div><div class="rule"><strong>安神秘法</strong><br>命中回生命，可能使后续攻击失去半血增伤。</div><div class="status">${html(tip)}</div></div></section><section class="panel"><div class="panelhead"><h2>战斗记录</h2><button class="btn small ghost" id="reportBtn">复制</button></div><div class="logs" id="logEntries">${g.logs.slice(0,32).map(x=>`<div class="entry"><span>战 ${x.floor} · 回合 ${x.turn}</span>${html(x.msg)}</div>`).join('')}</div></section><section class="panel"><div class="panelhead"><h2>实验边界</h2></div><div class="caption">全75张牌与升级版本均可在独立网页结算；18张原样板及57张扩展卡采用可追溯来源类型与原创命名分层。未完成正式人物审美批准、完整战役平衡、千星Lua同源与实体手机验收。<br><br>固定种子：2 · 本场 ${phaseTitle()}</div></section>`;}
function render(){renderProgress();el('main').innerHTML=({combat:combatScreen,reward:rewardScreen,camp:campScreen,win:endScreen,lose:endScreen}[g.phase]||combatScreen)();el('aside').innerHTML=asideHtml();renderDialog();}
function openModal(name){dialog=name;renderDialog();}
function closeModal(){dialog=null;renderDialog();}
function deckList(){const counts=new Map();for(const c of g.deck){const k=c.id+(c.upgraded?'+':'');counts.set(k,(counts.get(k)||0)+1);}return [...counts].map(([key,count])=>{const up=key.endsWith('+'),id=up?key.slice(0,-1):key,d=CARDS[id];return `<div class="item"><div><strong>${html(d.name)}${up?'+':''} ×${count}</strong><p>${html(up?d.upgradeDescription:d.description)}</p></div><span class="chip">${html(d.rarity)}</span></div>`;}).join('');}
function libraryList(search=''){return Object.values(CARDS).filter(c=>(c.name+c.description+c.role+c.rarity).toLowerCase().includes(search.trim().toLowerCase())).map(c=>`<div class="item"><div><strong>${html(c.name)}　<span class="muted">${html(c.type)} / ${html(c.rarity)}</span></strong><p>${html(c.description)}</p><p>${html(PROVENANCE[c.id].locator)} · ${html(SOURCE_NOTES[c.source])}</p></div><span class="chip gold">${c.cost}费</span></div>`).join('')||'<p class="empty">没有匹配的卡牌</p>';}
function practiceList(search=''){
 const query=search.trim().toLowerCase();
 const cards=Object.values(CARDS).filter(c=>(c.name+c.role+c.rarity+c.description).toLowerCase().includes(query));
 return cards.map(c=>`<div class="item"><div style="flex:1;min-width:0"><strong>${html(c.name)} <span class="muted">${html(c.rarity)} · ${html(c.type)} · ${c.cost}费</span></strong><p>${html(c.description)}</p><p class="muted">升级：${html(c.upgradeDescription)}</p></div><div class="practice-actions"><button class="btn small" data-practice="${html(c.id)}" data-upgraded="false" ${g.phase!=='combat'||g.practiceCount>=8?'disabled':''}>试用</button><button class="btn small bright" data-practice="${html(c.id)}" data-upgraded="true" ${g.phase!=='combat'||g.practiceCount>=8?'disabled':''}>试用+</button></div></div>`).join('')||'<p class="empty">没有符合条件的卡牌。</p>';
}
function dialogContents(){switch(dialog){
case 'practice':return `<div class="notes"><p><strong>自由试牌：</strong>75种不同卡牌，每种都有基础/升级效果。点击试用会加入当前永久卡组，并立即进入手牌（满10张则进入弃牌堆）；每局可加入8张。此模式仅用于逐卡/组合检验，不影响原始随机种子，不能作为自然获得平衡证据。当前已试用 ${g.practiceCount}/8 张。</p></div><input type="search" class="search" id="practiceSearch" placeholder="搜索75张卡牌、角色效果或稀有度" aria-label="搜索试牌卡"/><div class="items" id="practiceResults">${practiceList()}</div>`;
case 'guide':return `<div class="notes"><p><strong>怎么玩：</strong>点击敌人选目标、再点击手牌。下方结束回合后，先结算血梅香，再由仍存活的敌人按意图行动。每回合重新获得3能量、抽5张。数字键1–9选牌，空格结束回合。</p><p><strong>胡桃的关键决策：</strong>蝶引来生支付6HP进入2次己方结束阶段的蝶舞。半血（≤36HP）后攻击首命中增强，但生命不会自动恢复；安神秘法可造成群伤与回血，最多共回复12HP/战，命中后也可能改变你的低血状态。</p><p><strong>完整流程：</strong>连续5战，战后奖励三选一或跳过；第2、4战后可以休息+18HP，或选择升级一张永久卡。战斗内消耗不等于从永久卡组删除。</p><p><strong>已知测试边界：</strong>这是原作人物概念启发的独立回合制玩法实验，没有复用官方角色语音或素材；所有数值均为候选。没有联网，也不会碰正式游戏存档。</p></div>`;
case 'deck':return `<div class="caption">共${g.deck.length}张牌，升级计入永久牌组。当前抽/弃牌区只在本场有效。</div><div class="items">${deckList()}</div>`;
case 'library':return `<div class="caption">完整75张独立候选牌（6基础/26普通/25罕见/18稀有），69张非基础牌进入三选一奖励池。不把自动通过冒充人物审美终审。</div><input type="search" class="search" id="libSearch" placeholder="按卡名 / 功能 / 稀有度筛选" aria-label="搜索卡牌" /><div id="libResults" class="items">${libraryList()}</div>`;
case 'upgrade':return `<div class="caption">选择一张未升级的牌。升级后下一场开始生效。</div><div class="upgrades">${g.deck.filter(c=>!c.upgraded).map(c=>`<button class="upgrade" data-upgrade="${c.uid}"><strong>${html(CARDS[c.id].name)}　+ </strong><small>${html(CARDS[c.id].upgradeDescription)}</small></button>`).join('')||'<p class="empty">牌组已全部升级</p>'}</div>`;
default:return '';
}}
function renderDialog(){const root=el('overlayRoot');if(!dialog){root.innerHTML='';return;}root.innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-label="${html(dialog)}"><div class="modal"><div class="modal-head"><h2>${html(({guide:'玩法说明',deck:'当前牌组',library:'卡牌图鉴',upgrade:'选择升级卡牌',practice:'全75卡自由试牌台'})[dialog])}</h2><button class="btn small" id="closeDialog">关闭</button></div>${dialogContents()}</div></div>`;}
function reset(){g=new HutaoGame(2);dialog=null;render();gotoTop();}
async function copyReport(){const lines=[`胡桃 V5 五战战报 · 种子2 · ${g.phase}`,`进度${g.wins}/5 · 当前生命${g.hp}/${g.maxHp}`,`牌组：${g.deck.map(c=>CARDS[c.id].name+(c.upgraded?'+':'')).join('、')}`,...g.logs.slice().reverse().map(l=>`[战${l.floor}/回${l.turn}] ${l.msg}`)];const txt=lines.join('\n');try{await navigator.clipboard.writeText(txt);toast('战报已复制，可以粘贴给 AI 分析。')}catch(err){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.left='-99999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('已使用本地方式复制战报。')}catch(e){toast('浏览器限制了剪贴板，请改用手动复制。')}ta.remove();}}
document.addEventListener('click',e=>{
 const btn=e.target.closest('button');if(!btn)return;
 if(btn.dataset.practice){const added=g.practiceAdd(btn.dataset.practice,btn.dataset.upgraded==='true');if(added.ok){dialog=null;render();toast('试牌已加入卡组'+(g.hand.some(c=>c.id===btn.dataset.practice)?'，可在手牌立即测试':'，下次抽牌会出现'))}else toast(added.reason);return;}
 if(btn.dataset.card){const uid=Number(btn.dataset.card);const result=g.play(uid);if(!result.ok)toast(result.reason);render();return;}
 if(btn.dataset.target!==undefined){g.selected=Number(btn.dataset.target);render();return;}
 if(btn.dataset.reward!==undefined){const r=g.takeReward(btn.dataset.reward==='skip'?null:btn.dataset.reward);if(!r.ok)toast(r.reason);render();gotoTop();return;}
 if(btn.dataset.camp){if(btn.dataset.camp==='rest'){const r=g.takeCamp('rest');if(!r.ok)toast(r.reason);render();gotoTop();}else openModal('upgrade');return;}
 if(btn.dataset.upgrade){const r=g.takeCamp('upgrade',Number(btn.dataset.upgrade));if(!r.ok)toast(r.reason);dialog=null;render();gotoTop();return;}
 if(btn.id==='endBtn'){g.endTurn();render();return;}
 if(btn.id==='guideBtn'){openModal('guide');return;}
 if(btn.id==='deckBtn'||btn.id==='deckEndBtn'){openModal('deck');return;}
 if(btn.id==='libraryBtn'){openModal('library');return;}
 if(btn.id==='practiceBtn'){openModal('practice');return;}
 if(btn.id==='closeDialog'){closeModal();return;}
 if(btn.id==='reportBtn'){copyReport();return;}
 if(btn.id==='restartBtn'){if(window.confirm('重新开始五战？当前记录将丢失。'))reset();return;}
 if(btn.id==='againBtn'){reset();return;}
});
document.addEventListener('input',e=>{if(e.target.id==='libSearch'){const n=el('libResults');if(n)n.innerHTML=libraryList(e.target.value);}if(e.target.id==='practiceSearch'){const n=el('practiceResults');if(n)n.innerHTML=practiceList(e.target.value);}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea')||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='Escape'&&dialog){closeModal();return;}if(dialog||g.phase!=='combat')return;if(e.code==='Space'){e.preventDefault();g.endTurn();render();return;}if(/^[1-9]$/.test(e.key)){const c=g.hand[Number(e.key)-1];if(c){const r=g.play(c.uid);if(!r.ok)toast(r.reason);render();}}});

Object.defineProperty(window,'__hutaoReadOnly',{value:Object.freeze({state:()=>g.snapshot(),phase:()=>g.phase}),configurable:false});
render();
